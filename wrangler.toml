name = "simeon-gf-kiosk"
main = "./worker/index.ts"
compatibility_date = "2025-04-09"
upload_source_maps = true

# Verhindere Config-Umleitung
keep_vars = true

[observability]
enabled = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Environment Variables (set in Cloudflare Dashboard)
# GOOGLE_DRIVE_API_KEY - Google Drive API key
# KIOSK_PIN - PIN for authentication
# JWT_SECRET - Secret for JWT token signing (use random 32+ character string)
